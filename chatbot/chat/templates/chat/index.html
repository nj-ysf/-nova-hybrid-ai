{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova · Project chat</title>
    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">
    <script src="{% static 'chat/chat.js' %}" defer></script>
</head>
<body>
    <main class="chat-shell">
        <section class="chat-card" aria-label="Project chatbot">
            <header class="chat-header">
                <div class="avatar avatar-ai" aria-hidden="true">N</div>
                <div class="brand"><h1>Nova</h1><p>Your project assistant</p></div>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet-button" type="submit">Sign out</button></form>
            </header>
            <nav class="chat-controls" aria-label="Conversation controls">
                <label>Project <select id="project-select" disabled><option>Loading projects…</option></select></label>
                <label>Conversation <select id="conversation-select"><option value="">New conversation</option></select></label>
                <label>Processing <select id="mode-select"><option value="auto">Project default</option><option value="local">Local only</option></select></label>
                <button id="new-conversation" class="quiet-button" type="button">New chat</button>
            </nav>
            <div class="message-list" id="message-list" aria-live="polite"><p class="empty-state">Choose a project to begin. Answers use only the project sources you can access.</p></div>
            <p class="chat-status" id="chat-status" role="status"></p>
            <form class="message-form" id="message-form">
                {% csrf_token %}
                <label class="sr-only" for="message-input">Your message</label>
                <textarea id="message-input" rows="1" maxlength="12000" placeholder="Ask about your project…" required></textarea>
                <button id="send-button" type="submit" aria-label="Send message" disabled>↑</button>
            </form>
        </section>
    </main>
</body>
</html>
