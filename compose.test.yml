# Isolated, disposable database. Trust auth is limited to this loopback test port.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatbot_integration
      POSTGRES_USER: chatbot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_integration"]
      interval: 2s
      timeout: 5s
      retries: 30
